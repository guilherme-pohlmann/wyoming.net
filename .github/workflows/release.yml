name: Release Android APK

# Builds the Android APK from the MAUI app and publishes it as a GitHub release.
#
# Triggers:
#   - Push a tag like v1.2.3 (or v1.2.3-beta.1 for a pre-release):
#         git tag v1.2.3 && git push origin v1.2.3
#   - Run manually from the Actions tab and enter a version (the tag is created for you).
#
# Optional signing secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of your .keystore file   (base64 -w0 release.keystore)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
# Without them the APK is signed with the default debug key: fine for sideloading,
# but not for Google Play, and updates only work between APKs signed with the same key.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.3 (creates tag v1.2.3 on the selected branch)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: 9.0.x
  JAVA_VERSION: '17'
  # Folder of the Android app project. Leave empty to auto-detect it (the .csproj that targets Android
  # and has OutputType Exe). Set it, e.g. to Wyoming.Net.Satellite.App.Droid, to force a specific project.
  PROJECT_DIR: ''
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="$INPUT_VERSION"
          else
            RAW="$REF_NAME"
          fi
          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RAW' is not a valid version. Use something like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* || "$INPUT_PRERELEASE" == "true" ]]; then
            PRERELEASE=true
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "display_version=${VERSION%%-*}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The runner image also ships newer SDKs (11.x at the time of writing), and `dotnet` picks the
      # newest one by default. That SDK rejects net9.0-android as out of support, and workloads are
      # installed per SDK band. Pin the 9.x SDK before installing workloads or building anything.
      - name: Pin .NET SDK to 9.x
        run: |
          set -euo pipefail
          echo '{ "sdk": { "version": "9.0.100", "rollForward": "latestFeature" } }' > global.json
          dotnet --version

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Locate Android project
        id: project
        run: |
          set -euo pipefail
          # Only an app project (OutputType Exe) that targets Android produces an APK. A class library
          # that targets Android builds fine but outputs no APK.
          mapfile -t CANDIDATES < <(
            grep -rlE --include='*.csproj' 'net[0-9]+\.[0-9]+-android' . \
              | xargs -r grep -l '<OutputType>Exe</OutputType>' \
              | sed 's|^\./||' | sort || true
          )
          echo "Android app project candidates: ${CANDIDATES[*]:-none}"

          if [ -n "$PROJECT_DIR" ]; then
            PROJECT_FILE=$(find "$PROJECT_DIR" -maxdepth 1 -name '*.csproj' | head -n 1 || true)
            if [ -z "$PROJECT_FILE" ]; then
              echo "::error::No .csproj found in PROJECT_DIR '$PROJECT_DIR'."
              exit 1
            fi
          elif [ "${#CANDIDATES[@]}" -ge 1 ]; then
            PROJECT_FILE="${CANDIDATES[0]}"
            if [ "${#CANDIDATES[@]}" -gt 1 ]; then
              echo "::warning::Several Android app projects found, using $PROJECT_FILE. Set PROJECT_DIR at the top of the workflow to choose another."
            fi
          else
            echo "::error::No Android app project found (a .csproj that targets Android and has <OutputType>Exe</OutputType>). Set PROJECT_DIR at the top of the workflow."
            echo "Projects that mention Android:"
            grep -rlE --include='*.csproj' 'android' . || true
            exit 1
          fi

          TFM=$(grep -oE 'net[0-9]+\.[0-9]+-android[0-9.]*' "$PROJECT_FILE" | head -n 1 || true)
          if [ -z "$TFM" ]; then
            echo "::error::$PROJECT_FILE does not target Android (no net*-android target framework found)."
            exit 1
          fi
          echo "Using $PROJECT_FILE ($TFM)"
          {
            echo "file=$PROJECT_FILE"
            echo "dir=$(dirname "$PROJECT_FILE")"
            echo "tfm=$TFM"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare signing keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. The APK will be signed with the debug key (fine for sideloading, not for Google Play)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish APK
        env:
          PROJECT_FILE: ${{ steps.project.outputs.file }}
          TFM: ${{ steps.project.outputs.tfm }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display_version }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ARGS=(
            "$PROJECT_FILE"
            -f "$TFM"
            # Restore every project for Android only. The projects also list ios/maccatalyst targets,
            # which need workloads that cannot be installed on a Linux runner.
            -p:TargetFrameworks="$TFM"
            -c Release
            -p:AndroidPackageFormat=apk
            -p:ApplicationDisplayVersion="$DISPLAY_VERSION"
            -p:ApplicationVersion="$GITHUB_RUN_NUMBER"
            -p:InstallAndroidDependencies=true
            -p:AcceptAndroidSDKLicenses=true
          )
          if [ "$SIGNING_ENABLED" = "true" ]; then
            ARGS+=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$KEYSTORE_PATH"
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
              -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
              -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
            )
          fi
          dotnet publish "${ARGS[@]}"

      - name: Collect APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT="$APP_DIR/bin/Release"
          APK=$(find "$OUT" -name '*-Signed.apk' 2>/dev/null | head -n 1 || true)
          if [ -z "$APK" ]; then
            APK=$(find "$OUT" -name '*.apk' 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced in $OUT."
            echo "APK/AAB files anywhere in the repo:"
            find . \( -name '*.apk' -o -name '*.aab' \) -not -path './.git/*' || true
            echo "Contents of $OUT:"
            find "$OUT" -maxdepth 3 2>/dev/null | head -n 60 || true
            exit 1
          fi
          echo "Found $APK"
          cp "$APK" "dist/Wyoming.Net-${VERSION}-android.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  release:
    name: Create GitHub release
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ needs.build-apk.outputs.tag }}
          PRERELEASE: ${{ needs.build-apk.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists, replacing its assets."
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            FLAGS=()
            if [ "$PRERELEASE" = "true" ]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" dist/* \
              --repo "$REPO" \
              --target "$SHA" \
              --title "Wyoming.NET $TAG" \
              --notes "Android APK attached below. SHA-256 checksums are in SHA256SUMS.txt." \
              --generate-notes \
              "${FLAGS[@]}"
          fi
